  'camera-refusee':"L'accès à l'appareil photo a été refusé. Autorise-le pour cette appli dans les réglages du navigateur, ou vise le QR code avec l'appli Appareil photo du téléphone.",
  'camera-absente':"Aucun appareil photo n'est disponible ici. Sur cet appareil, choisis plutôt « Afficher le QR code »."
};
let synchro = null, arretScan = null;
function arreterSynchro(){ if (arretScan) { arretScan(); arretScan = null; } if (synchro) { synchro.fermer(); synchro = null; } }
function ecranSynchro(corps, pied){ const c = $('#syncCorps'), p = $('#syncPied'); if (!c || !p) return false; c.innerHTML = corps; p.innerHTML = pied; return true; }
const piedFermer = (principal = false) => `<span class="espace"></span><button type="button" class="btn${principal ? ' btn-plein' : ''}" data-dlg="fermer">Fermer</button>`;
const piedRetour = `<button type="button" class="btn discret" data-dlg="sync-retour">Retour</button><span class="espace"></span><button type="button" class="btn" data-dlg="fermer">Fermer</button>`;
const attente = t => `<p class="attente"><span class="rond" aria-hidden="true"></span><span>${t}</span></p>`;

function ouvrirSynchro(rejoindre){
  const dlg = $('#dlg'); dlg.className = 'etroit';
  dlg.innerHTML = `<header class="dlg-tete"><h2 id="dlgTitre">Synchroniser</h2><p class="sous">Avec ton autre appareil, directement par le Wi-Fi</p></header>
    <div class="dlg-corps" id="syncCorps" aria-live="polite"></div><footer class="dlg-pied" id="syncPied"></footer>`;
  ouvrirDialogue({
    surFermeture: arreterSynchro,
    bloquer: () => !!(synchro && synchro.application),
    clic: b => { const a = b.dataset.dlg; if (a === 'sync-hote') syncHote(); else if (a === 'sync-scan') syncScan(); else if (a === 'sync-retour') syncChoix(); else if (a === 'sync-annuler-derniere') annulerDerniereSynchro(); }
  });
  const imp = synchroPossible();
  if (imp) return syncErreur(imp, false);
  if (rejoindre) syncRejoindre(rejoindre); else syncChoix();
}
async function syncChoix(){
  arreterSynchro();
  const t = typeAppareil(), mobile = t !== 'ordinateur';
  const conseil = '<span class="conseil">Conseillé ici</span>';
  const optHote = `<button type="button" class="sync-option" data-dlg="sync-hote"><span class="ico">${ICONES.qr}</span><strong>Afficher le QR code${mobile ? '' : conseil}</strong><span class="sous">À faire sur l'ordinateur</span></button>`;
  const optScan = `<button type="button" class="sync-option" data-dlg="sync-scan"><span class="ico">${ICONES.photo}</span><strong>Scanner le QR code${mobile ? conseil : ''}</strong><span class="sous">À faire sur le téléphone, avec l'appareil photo</span></button>`;
  ecranSynchro(`<p class="aide">Ouvre le Carnet sur tes deux appareils, connectés au même Wi-Fi. L'un affiche un QR code, l'autre le scanne.</p>
    <div class="sync-options">${mobile ? optScan + optHote : optHote + optScan}</div>
    <p class="aide">Les fiches passent directement d'un appareil à l'autre, chiffrées avec une clé à usage unique contenue dans le QR code. Des services gratuits servent seulement à mettre les deux appareils en relation : ils ne voient jamais tes fiches.</p>
    <p id="syncAnnuler" class="sous" style="margin:14px 0 4px"></p>`, piedFermer());
  let snap = null;
  try { if (idb) { const v = await idbLire('avant-synchro'); if (v) snap = JSON.parse(v); } } catch (e) {}
  const z = $('#syncAnnuler');
  if (z && snap && snap.le) z.innerHTML = `Un souci après la synchronisation du ${fmtDate(snap.le.slice(0, 10))}&nbsp;? <button type="button" class="lien" data-dlg="sync-annuler-derniere">Remettre cet appareil comme avant</button>`;
}
function rappelsSynchro(s){
  const actif = () => synchro === s;
  return {
    etape: (nom, appareil) => {
      if (!actif()) return;
      if (nom === 'connexion') ecranSynchro(`<div class="sync-centre">${attente("Connexion avec l'autre appareil…")}</div>`, piedFermer());
      else if (nom === 'echange') ecranSynchro(`<div class="sync-centre">${attente(appareil ? `Échange des fiches avec ${nomAppareil(appareil)}…` : 'Connexion établie, échange des fiches…')}<p class="aide">Garde l'appli ouverte sur les deux appareils.</p></div>`, '<span class="espace"></span>');
    },
    appliquer: (resultat, appareil) => appliquerSynchro(resultat, appareil),
    fini: (bilan, appareil) => { if (actif()) { synchro = null; syncFini(bilan, appareil); } },
    erreur: code => { if (actif()) { synchro = null; syncErreur(code, true); } }
  };
}
async function syncHote(){
  arreterSynchro();
  const r = {}, s = synchro = creerSession('hote', r);
  Object.assign(r, rappelsSynchro(s));
  ecranSynchro(`<div class="sync-centre">${attente('Préparation du QR code…')}</div>`, piedRetour);
  let lien;
  try { lien = await s.preparerHote(); } catch (e) { if (synchro === s) { synchro = null; s.fermer(); syncErreur(e.code || 'reseau', true); } return; }
  if (!lien || synchro !== s) return;
  ecranSynchro(`<div class="sync-centre">
    <div class="qr-cadre">${QR.svg(lien, {label:'QR code de synchronisation'})}</div>
    <p class="aide">Sur ton téléphone, ouvre le Carnet, touche « Synchroniser » puis « Scanner le QR code ». Tu peux aussi le viser avec l'appli Appareil photo.</p>
    ${attente("En attente de l'autre appareil…")}
    <p class="sous">Ce QR code ne sert qu'une fois et s'efface à la fermeture de cette fenêtre.</p></div>`, piedRetour);
}
async function syncScan(){
  arreterSynchro();
  ecranSynchro(`<div class="sync-centre"><div class="viseur"><video id="syncVideo" playsinline muted aria-label="Image de l'appareil photo"></video></div>
    <p class="aide" id="syncScanAide">Vise le QR code affiché sur l'ordinateur.</p></div>`, piedRetour);
  const video = $('#syncVideo');
  let dernierAvis = 0;
  try {
    const arret = await demarrerScan(video, texte => {
      const info = lireLienSynchro(texte);
      if (info) { arretScan = null; syncRejoindre(info); return true; }
      if (Date.now() - dernierAvis > 2500) { dernierAvis = Date.now(); const a = $('#syncScanAide'); if (a) a.textContent = "Ce QR code n'est pas celui du Carnet. Vise le QR code affiché par l'appli sur l'ordinateur."; }
      return false;
    });
    if (!$('#syncVideo')) { arret(); return; } // fenêtre fermée entre-temps
    arretScan = arret;
  } catch (e) { syncErreur(e.code || 'camera-absente', true); }
}
async function syncRejoindre(info){
  arreterSynchro();
  const r = {}, s = synchro = creerSession('invite', r);
  Object.assign(r, rappelsSynchro(s));
  ecranSynchro(`<div class="sync-centre">${attente("Connexion à l'autre appareil…")}</div>`, piedFermer());
  try { await s.rejoindre(info); } catch (e) { if (synchro === s) { synchro = null; s.fermer(); syncErreur(e.code || 'reseau', true); } }
}
async function appliquerSynchro(resultat, appareil){
  if (idb) { try { await idbEcrire(JSON.stringify({le:new Date().toISOString(), etat}), 'avant-synchro'); } catch (e) {} }
  const locaux = {};
  Fusion.REGLAGES_LOCAUX.forEach(k => { locaux[k] = etat.reglages[k]; });
  etat = normaliser({...etat, ...clone(resultat), reglages:{...clone(resultat.reglages), ...locaux}});
  etat.reglages.derniereSynchro = new Date().toISOString();
  etat.reglages.synchroAvec = appareil || '';
  await ecrireMaintenant();
  render();
}
const LIBELLES = {clients:['fiche', 'fiches'], questionnaires:['questionnaire', 'questionnaires'], seances:['séance', 'séances'], factures:['facture', 'factures']};
function texteQuantites(o){
  const p = [];
  for (const k of COLLECTIONS) if (o[k]) p.push(`${o[k]} ${LIBELLES[k][o[k] > 1 ? 1 : 0]}`);
  if (o.reglages) p.push('tes réglages');
  return p.length > 1 ? p.slice(0, -1).join(', ') + ' et ' + p[p.length - 1] : (p[0] || '');
}
function syncFini(b, appareil){
  const nom = nomAppareil(appareil);
  const lignes = [];
  const recus = texteQuantites(b.recus), envoyes = texteQuantites(b.envoyes), retires = texteQuantites(b.retires), effaces = texteQuantites(b.effaces || {});
  const n = t => `<span class="nobr">n° ${esc(t)}</span>`;
  if (recus) lignes.push(`<strong>Reçu de ${esc(nom)} :</strong> ${esc(recus)}`);
  if (envoyes) lignes.push(`<strong>Envoyé à ${esc(nom)} :</strong> ${esc(envoyes)}`);
  if (retires) lignes.push(`<strong>Supprimé aussi ici :</strong> ${esc(retires)}`);
  if (effaces) lignes.push(`<strong>Supprimé aussi sur ${esc(nom)} :</strong> ${esc(effaces)}`);
  b.renumerotees.forEach(x => lignes.push(`<strong>Facture renumérotée :</strong> ${esc(x.client || 'sans nom')}, ${n(x.ancien)} devenu ${n(x.nouveau)}. Le même numéro avait été utilisé sur tes deux appareils et cette facture n'avait pas encore été transmise.`));
  b.doublons.forEach(x => lignes.push(`<strong>Numéro en double :</strong> deux factures déjà transmises portent le ${n(x.numero)}. Détails sur l'accueil.`));
  ecranSynchro(`<div class="sync-centre"><div class="pastille-ok">${ICONES.ok}</div><h3 class="titre-bloc" style="margin:0 0 4px">Synchronisation terminée</h3>
    ${lignes.length ? `<ul class="bilan">${lignes.map(l => `<li>${l}</li>`).join('')}</ul>` : `<p class="aide">Rien à échanger : tes deux carnets étaient déjà identiques.</p>`}
    <p class="sous" style="margin-top:12px">Les deux appareils ont maintenant exactement les mêmes fiches.</p></div>`, piedFermer(true));
  toast('Synchronisation terminée');
}
function detailReseau(){
  const nom = k => NOMS_SERVICES[k] || k;
  const lignes = Object.keys(DIAG.services).map(k => `${nom(k)} : ${DIAG.services[k]}`);
  if (!DIAG.role && !lignes.length && !DIAG.apres) return '';
  const debut = DIAG.role === 'invite' ? `Cet appareil scannait le QR code, qui indiquait : ${DIAG.liste.split('').map(nom).join(', ') || 'rien'}.` : (DIAG.role === 'hote' ? 'Cet appareil affichait le QR code.' : '');
  return [debut, lignes.join(' ; '), DIAG.apres].filter(Boolean).join(' ');
}
function syncErreur(code, retour){
  const detail = code === 'reseau' ? detailReseau() : '';
  ecranSynchro(`<div class="sync-centre"><div class="pastille-ok erreur">${ICONES.erreur}</div><h3 class="titre-bloc" style="margin:0 0 6px">La synchronisation n'a pas pu se faire</h3>
    <p class="aide">${esc(MESSAGES_SYNC[code] || MESSAGES_SYNC.coupure)}</p>${detail ? `<p class="sous" style="margin-top:10px">Détail technique : ${esc(detail)}</p>` : ''}</div>`,
    retour ? `<button type="button" class="btn discret" data-dlg="sync-retour">Réessayer</button>${piedFermer()}` : piedFermer());
}
async function annulerDerniereSynchro(){
  let snap = null;
  try { const v = await idbLire('avant-synchro'); if (v) snap = JSON.parse(v); } catch (e) {}
  if (!snap || !snap.etat) return;
  const d = new Date(snap.le);
  if (!confirm(`Remettre cet appareil exactement comme avant la synchronisation du ${fmtDate(snap.le.slice(0, 10))} à ${pad(d.getHours())}h${pad(d.getMinutes())} ?\n\nCe que tu as saisi ici depuis sera perdu. L'autre appareil n'est pas modifié : la prochaine synchronisation te renverra ses fiches.`)) return;
  etat = migrer(normaliser(snap.etat));
  try { await idbEcrire(JSON.stringify(null), 'avant-synchro'); } catch (e) {}
  await ecrireMaintenant();
  fermerDialogue(); location.hash = '#/'; render();
  toast("Cet appareil est revenu à son état d'avant la synchronisation");
}

/* Appli installable et hors connexion */
let invitationInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); invitationInstall = e; const b = $('#btnInstaller'); if (b) b.hidden = false; });
window.addEventListener('appinstalled', () => { invitationInstall = null; const b = $('#btnInstaller'); if (b) b.hidden = true; toast('Appli installée : tu la retrouves avec tes autres applis.'); });
async function installer(){
  if (!invitationInstall) return;
  invitationInstall.prompt();
  try { await invitationInstall.userChoice; } catch (e) {}
  invitationInstall = null; const b = $('#btnInstaller'); if (b) b.hidden = true;

if ('serviceWorker' in navigator && window.isSecureContext && location.protocol !== 'file:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });

/* ---------- Message éphémère ---------- */
let minuteurToast = null;
function toast(t, duree = 3200){ const el = $('#toast'); el.textContent = t; el.classList.add('visible'); clearTimeout(minuteurToast); minuteurToast = setTimeout(() => el.classList.remove('visible'), duree); }

/* =========================================================
   Événements
   ========================================================= */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b || b.closest('dialog')) return;
  const c = ui.clientId ? client(ui.clientId) : null;
  const id = b.dataset.id;
  switch (b.dataset.action) {
    case 'client-nouveau': ouvrirNouveauClient(); break;
    case 'exporter': exporter(); break;
    case 'importer': $('#fichierImport').value = ''; $('#fichierImport').click(); break;
    case 'reglages': ouvrirReglages(); break;
    case 'synchro': ouvrirSynchro(null); break;
    case 'installer': installer(); break;
    case 'imprimer-fiche': if (c) imprimer(htmlImpFiche(c)); break;
    case 'client-supprimer': if (c) {
      const ns = etat.seances.filter(s => s.clientId === c.id).length;
      if (confirm(`Supprimer définitivement la fiche de ${nomComplet(c)}, ses questionnaires et ses ${ns} séance${ns > 1 ? 's' : ''} ? Les factures déjà émises sont conservées pour ta comptabilité.`)) {
        oublier('seances', etat.seances.filter(x => x.clientId === c.id).map(x => x.id)); oublier('questionnaires', etat.questionnaires.filter(x => x.clientId === c.id).map(x => x.id)); oublier('clients', c.id);
        enregistrer(); location.hash = '#/'; toast('Fiche supprimée');
      } } break;
    case 'quest-nouveau': ui.questMode = {id:null, baseId:null}; majContenu(); break;
    case 'quest-maj': { const q = dernierQuestionnaire(c.id); ui.questMode = {id:null, baseId:q && q.id}; majContenu(); break; }
    case 'quest-modifier': ui.questMode = {id, baseId:null}; majContenu(); break;
    case 'quest-voir': ui.questVue = id; majContenu(); break;
    case 'quest-annuler': ui.questMode = null; majContenu(); $('#principal').scrollTop = 0; break;
    case 'quest-supprimer': { const q = etat.questionnaires.find(x => x.id === id); if (q && confirm(`Supprimer le questionnaire du ${fmtDate(q.date)} ?`)) { oublier('questionnaires', id); ui.questMode = null; ui.questVue = null; enregistrer(); render(); toast('Questionnaire supprimé'); } break; }
    case 'quest-imprimer': imprimer(htmlImpQuestionnaire(c, etat.questionnaires.find(x => x.id === id))); break;
    case 'quest-imprimer-vierge': imprimer(htmlImpQuestionnaire(c, null)); break;
    case 'seance-nouvelle': ouvrirSeance(c, null); break;
    case 'seance-ouvrir': ouvrirSeance(c, id); break;
    case 'facture-nouvelle': ouvrirFacture(c, null, null); break;
    case 'facture-ouvrir': ouvrirFacture(c, id, null); break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'recherche') { ui.recherche = t.value; renderListe(); return; }
  if (t.matches('[data-champ-client]')) {
    const c = client(ui.clientId); if (!c) return;
    const k = t.name;
    c[k] = t.type === 'checkbox' ? t.checked : t.value;
    if (k === 'consentRgpd') { c.consentRgpdDate = t.checked ? (c.consentRgpdDate || aujourdhui()) : ''; const sp = $('#rgpdDate'); if (sp) sp.textContent = t.checked ? `Accord noté le ${fmtDate(c.consentRgpdDate)}` : ''; }
    c.majLe = new Date().toISOString();
    enregistrer();
    majEntete(c);
    if (['prenom','nom','tel','email','ville'].includes(k)) renderListe();
    const l = $(`[data-liens="${k}"]`); if (l) l.innerHTML = liensContact(k, t.value);
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'choixMesure') { ui.mesure = t.value; majContenu(); return; }
  if (t.id === 'fichierImport' && t.files && t.files[0]) { importer(t.files[0]); return; }
  if (t.matches('.cases input[type=checkbox]') && t.checked) {
    const grp = t.closest('.cases');
    if (t.hasAttribute('data-aucun')) $$('input', grp).forEach(i => { if (i !== t) i.checked = false; });
    else { const a = $('input[data-aucun]', grp); if (a) a.checked = false; }
  }
});
document.addEventListener('submit', e => { if (e.target.id === 'formQuest') { e.preventDefault(); enregistrerQuestionnaire(e.target); } });

/* =========================================================
   Démarrage
   ========================================================= */
(async function demarrer(){
  await charger();
  route();
  if (statutStockage === 'erreur') toast("Ce navigateur bloque l'enregistrement (navigation privée ?). Tes saisies seront perdues à la fermeture.", 9000);
})();
