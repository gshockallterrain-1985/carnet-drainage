<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carnet de drainage</title>
<meta name="description" content="Fiches clients, questionnaires de santé, suivi des séances et factures. Les données restent sur tes appareils.">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2A7570" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#102627" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carnet">
<style>
/* Couleurs de l'identité visuelle : pétrole #0F3A3C, lagon #2A7570, eau claire #BFDCD8, brume #EEF5F4 */
:root{
  --fond:#EEF5F4;
  --papier:#FFFFFF;
  --papier-2:#E4EFED;
  --encre:#0F3A3C;
  --encre-2:#3C5F60;
  --encre-3:#4B6969;
  --trait:#BFDCD8;
  --lagon:#2A7570;
  --lagon-fort:#1C5753;
  --lagon-clair:#D3E8E5;
  --sur-lagon:#FFFFFF;
  --zone:#D9EAE7;
  --zone-trait:#8DB7B2;
  --alerte:#9C3826;
  --alerte-fond:#F5E1DB;
  --veille:#84600E;
  --veille-fond:#F4EAD2;
  --ok:#2F6B45;
  --focus:#2A7570;
  --serif:'Palatino Linotype','Book Antiqua',Palatino,'URW Palladio L',P052,Georgia,serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --fond:#0A1C1D; --papier:#102627; --papier-2:#153031; --encre:#E3F0EE; --encre-2:#A6C4C0; --encre-3:#86A8A4;
    --trait:#244241; --lagon:#79C0B8; --lagon-fort:#A3D9D2; --lagon-clair:#1A3E3C; --sur-lagon:#06201F;
    --zone:#1D3B3A; --zone-trait:#4A716C; --alerte:#EE9580; --alerte-fond:#3A2420; --veille:#E2B75E; --veille-fond:#332916;
    --ok:#7CC394; --focus:#A3D9D2; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fond);color:var(--encre);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--lagon-fort)}
h1,h2,h3{margin:0}
p{margin:0 0 10px}
[hidden]{display:none!important}

/* Structure */
.app{display:grid;grid-template-columns:292px minmax(0,1fr);height:100vh;height:100dvh}
.barre{display:flex;flex-direction:column;min-height:0;background:var(--papier-2);border-right:1px solid var(--trait)}
.barre-tete{padding:20px 16px 12px;display:grid;gap:10px}
.marque{font-family:var(--serif);font-size:23px;line-height:1.15;margin:0}
.liste{list-style:none;margin:0;padding:4px 8px 12px;overflow:auto;flex:1;min-height:0}
.liste li a{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:8px;padding:9px 10px;border-radius:7px;color:inherit;text-decoration:none}
.liste li a:hover{background:var(--papier)}
.liste li a[aria-current="page"]{background:var(--papier);box-shadow:inset 3px 0 0 var(--lagon)}
.nom-liste{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.liste .sous{grid-column:1/-1}
.liste-vide{padding:12px 10px;color:var(--encre-3);font-size:14px}
.pastille{align-self:center;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font-size:12px;font-weight:700;background:var(--alerte);color:var(--papier)}
.pastille.orange{background:var(--veille)}
.sous{font-size:13px;color:var(--encre-3)}
.pied{border-top:1px solid var(--trait);padding:12px 16px 16px;display:grid;gap:6px}
.statut{margin:0;font-size:13px;display:flex;align-items:center;gap:7px;color:var(--encre-2)}
.statut::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.statut.erreur{color:var(--alerte)}
.statut.erreur::before{background:var(--alerte)}
.statut.attente::before{background:var(--encre-3)}
#sauvegardeInfo{margin:0}
#sauvegardeInfo.retard{color:var(--veille)}
.principal{overflow:auto;min-height:0;outline:none}
.page{max-width:900px;margin:0 auto;padding:30px 36px 72px}

/* En-tête de fiche */
.tete{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.fiche-nom{font-family:var(--serif);font-weight:normal;font-size:36px;line-height:1.1}
.meta{display:flex;flex-wrap:wrap;gap:4px 20px;margin-top:8px;color:var(--encre-2)}
.meta a{color:var(--lagon-fort);text-decoration:none;border-bottom:1px solid var(--lagon-clair)}
.meta a:hover{border-bottom-color:var(--lagon)}
.retour{display:none;margin:0 0 8px -6px}
.onglets{display:flex;gap:2px;border-bottom:1px solid var(--trait);margin:24px 0 26px;overflow-x:auto;scrollbar-width:none}
.onglets a{padding:10px 14px 9px;color:var(--encre-2);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.onglets a:hover{color:var(--encre)}
.onglets a[aria-current="page"]{color:var(--encre);border-bottom-color:var(--lagon);font-weight:600}

/* Blocs */
.bloc{margin:0 0 30px}
.titre-bloc{font-family:var(--serif);font-weight:normal;font-size:22px;line-height:1.25;margin:0 0 12px}
.titre-ligne{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px 16px;margin-bottom:14px}
.titre-ligne .titre-bloc{margin:0}
.sous-titre{font-size:15px;font-weight:600;margin:24px 0 6px}
.aide{color:var(--encre-2);font-size:14px;max-width:68ch}
.vide{border:1px dashed var(--zone-trait);border-radius:10px;padding:22px;color:var(--encre-2)}
.vide p{max-width:60ch}

/* Formulaires */
.grille{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.grille.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grille.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.champ{display:flex;flex-direction:column;gap:5px;min-width:0}
.champ.large{grid-column:1/-1}
.champ > label,.etiquette{font-size:13px;color:var(--encre-2)}
.lbl-ligne{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:13px;color:var(--encre-2)}
.liens-contact{display:flex;gap:12px}
.liens-contact a{text-decoration:none;font-weight:600}
.liens-contact a:hover{text-decoration:underline}
input[type=text],input[type=tel],input[type=email],input[type=date],input[type=time],input[type=search],select,textarea{font:inherit;color:inherit;background:var(--papier);border:1px solid var(--trait);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
input::placeholder,textarea::placeholder{color:var(--encre-3)}
textarea{min-height:72px;resize:vertical;line-height:1.45}
input:hover,select:hover,textarea:hover{border-color:var(--zone-trait)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline-offset:0;border-color:var(--lagon)}
fieldset{border:0;padding:0;margin:0 0 26px;min-width:0}
legend{font-family:var(--serif);font-size:19px;padding:0;margin-bottom:10px}
.case{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.case input{margin-top:3px;width:17px;height:17px;accent-color:var(--lagon);flex:none}
.erreur-form{color:var(--alerte);font-size:14px;margin:8px 0 0}

/* Boutons */
.btn{font:inherit;font-size:14px;line-height:1.2;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:6px;border:1px solid var(--trait);background:var(--papier);color:var(--encre);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--zone-trait);background:var(--papier-2)}
.btn-plein{background:var(--lagon);border-color:var(--lagon);color:var(--sur-lagon)}
.btn-plein:hover{background:var(--lagon-fort);border-color:var(--lagon-fort)}
.btn.discret{background:transparent;border-color:transparent;color:var(--lagon-fort)}
.btn.danger{background:transparent;border-color:transparent;color:var(--alerte)}
.btn.danger:hover{background:var(--alerte-fond)}
.btn.petit{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.large-btn{width:100%}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lien{font:inherit;background:none;border:0;padding:0;color:var(--lagon-fort);cursor:pointer;text-decoration:underline;text-underline-offset:2px}

/* Alertes */
.alerte{border-left:3px solid var(--alerte);background:var(--alerte-fond);padding:10px 14px;border-radius:0 7px 7px 0;margin-top:12px}
.alerte > strong{display:block;color:var(--alerte);font-weight:600}
.alerte.orange{border-left-color:var(--veille);background:var(--veille-fond)}
.alerte.orange > strong{color:var(--veille)}
.alerte ul{margin:4px 0 0;padding-left:18px}
.alerte p{margin:4px 0 0;white-space:pre-line}

/* Questionnaire */
.q-section{margin:0 0 30px}
.q-section > legend{display:flex;gap:10px;align-items:baseline}
.q-num{font-family:var(--serif);color:var(--lagon-fort)}
.q-question{padding:12px 0;border-top:1px solid var(--trait)}
.q-label{display:block;margin-bottom:8px}
.cases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 20px}
.cases label{display:flex;gap:9px;align-items:flex-start;cursor:pointer;padding:3px 0}
.cases input{margin-top:3px;width:17px;height:17px;accent-color:var(--lagon);flex:none}
.cases input[data-niveau="rouge"]:checked + span{color:var(--alerte);font-weight:600}
.cases input[data-niveau="orange"]:checked + span{color:var(--veille);font-weight:600}
.segment{position:relative;display:inline-flex;flex-wrap:wrap;border:1px solid var(--trait);border-radius:7px;overflow:hidden;background:var(--papier)}
.segment input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.segment label{padding:6px 14px;cursor:pointer;color:var(--encre-2);border-right:1px solid var(--trait)}
.segment label:last-of-type{border-right:0}
.segment input:checked + label{background:var(--lagon);color:var(--sur-lagon)}
.segment input[data-niveau="rouge"]:checked + label{background:var(--alerte);color:var(--papier)}
.segment input[data-niveau="orange"]:checked + label{background:var(--veille);color:var(--papier)}
.segment input:focus-visible + label{outline:2px solid var(--focus);outline-offset:-2px}
.precisions{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 14px;margin-top:10px}
.annexe{background:var(--papier-2);border-radius:8px;padding:14px 18px;font-size:14px;margin-bottom:14px}
.annexe ul{margin:4px 0 10px;padding-left:20px}
.repris{display:flex;flex-wrap:wrap;gap:4px 22px;font-size:14px;color:var(--encre-2)}
.repris .manque{color:var(--veille)}
.reponses{margin:0}
.rep{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:4px 18px;padding:9px 0;border-top:1px solid var(--trait)}
.rep.plein{grid-template-columns:minmax(0,1fr)}
.rep dt{color:var(--encre-2)}
.rep dd{margin:0}
.puces{display:flex;flex-wrap:wrap;gap:6px}
.puce{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--lagon-clair);font-size:13.5px}
.puce.rouge{background:var(--alerte-fond);color:var(--alerte);font-weight:600}
.puce.orange{background:var(--veille-fond);color:var(--veille);font-weight:600}
.sous-rep{font-size:14px;margin-top:3px}
.non-rens{color:var(--encre-3)}
.engag{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.engag .manque{color:var(--veille)}
.historique{list-style:none;padding:0;margin:0}
.historique li{padding:5px 0}
.encadre{background:var(--papier);border:1px solid var(--trait);border-radius:10px;padding:12px 16px;margin:0 0 22px;max-width:72ch}
.encadre > strong{display:block;margin-bottom:2px}
.encadre p{margin:0}
.q-section > .aide{margin:-4px 0 6px}
.q-question.compact{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;align-items:center}
.q-question.compact .q-label{margin:0}
.q-question.compact .precisions{grid-column:1/-1;margin-top:2px}
.q-question:not(:has(input[value="oui"]:checked)) .precisions.si-oui{display:none}
.texte-long{white-space:pre-line}
.badge-modele{display:inline-block;font-family:var(--sans);font-size:12.5px;padding:1px 9px;border-radius:999px;background:var(--lagon-clair);color:var(--lagon-fort);font-weight:600;vertical-align:2px;margin-left:8px;white-space:nowrap}
.non-liste{color:var(--encre-2);font-size:14px}
.non-liste.manque{color:var(--veille)}

/* Séances */
.seances{list-style:none;margin:0;padding:0}
.seance{font:inherit;color:inherit;background:none;border:0;border-top:1px solid var(--trait);text-align:left;display:grid;grid-template-columns:64px minmax(0,1fr);gap:18px;width:100%;padding:16px 8px 16px 0;cursor:pointer}
.seance:hover .seance-titre{color:var(--lagon-fort)}
.date-rail{text-align:right}
.jour{display:block;font-family:var(--serif);font-size:30px;line-height:1}
.mois{display:block;font-size:12.5px;color:var(--encre-2);margin-top:3px}
.seance-corps{display:grid;gap:3px;min-width:0}
.seance-titre{font-weight:600}
.extrait{color:var(--encre-2);font-size:14px}
.note-alerte{color:var(--alerte);font-size:14px}
.badge{display:inline-block;font-size:12.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--trait);color:var(--encre-2);margin-left:8px;font-weight:normal;vertical-align:1px}
.carte-corps{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px 26px;align-items:start}
.corps{width:100%;height:auto;display:block}
.corps .neutre{fill:var(--papier-2);stroke:var(--zone-trait);stroke-width:1}
.corps .zone{fill:var(--zone);stroke:var(--zone-trait);stroke-width:1;cursor:pointer;transition:fill .12s}
.corps .zone:hover{fill:var(--lagon-clair)}
.corps .zone[aria-pressed="true"]{fill:var(--lagon);stroke:var(--lagon-fort)}
.corps .zone:focus{outline:none}
.corps .zone:focus-visible{stroke:var(--encre);stroke-width:2.5}
.corps .num{font:600 12px var(--sans);fill:var(--encre-2);pointer-events:none;text-anchor:middle}
.corps .num.on{fill:var(--sur-lagon)}
.corps .cote{font:12px var(--sans);fill:var(--encre-3);text-anchor:middle}
.corps .legende{font:13px var(--sans);fill:var(--encre-2);text-anchor:middle}
.ordre{margin:0;padding-left:20px;font-size:14px;color:var(--encre-2)}
.ordre li.on{color:var(--encre);font-weight:600}
.mesures{border-collapse:collapse;width:100%;max-width:520px}
.mesures th,.mesures td{padding:5px 10px 5px 0;text-align:left;font-weight:normal;border-bottom:1px solid var(--trait)}
.mesures thead th{font-size:13px;color:var(--encre-2)}
.mesures input{max-width:100px}
details.bloc > summary{cursor:pointer;font-family:var(--serif);font-size:19px;margin-bottom:10px}

/* Graphique */
.graph-zone{position:relative;background:var(--papier);border:1px solid var(--trait);border-radius:10px;padding:14px 16px 12px;margin-bottom:28px}
.graph-tete{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:6px}
.graph-tete select{width:auto}
.graph{width:100%;height:auto;display:block}
.graph .g-grille{stroke:var(--trait);stroke-width:1}
.graph .g-axe{font:12px var(--sans);fill:var(--encre-3)}
.graph .g-ligne{fill:none;stroke:var(--lagon);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.graph .g-lien{stroke:var(--zone-trait);stroke-width:1.5;stroke-dasharray:2 3}
.graph .g-avant{fill:var(--lagon);stroke:var(--papier);stroke-width:2}
.graph .g-apres{fill:var(--papier);stroke:var(--lagon);stroke-width:2}
.graph .g-cible{fill:transparent}
.graph .g-cible:focus{outline:none}
.graph .g-cible:focus-visible{stroke:var(--focus);stroke-width:2}
.infobulle{position:absolute;pointer-events:none;background:var(--encre);color:var(--papier);font-size:13px;padding:6px 9px;border-radius:6px;white-space:nowrap;transform:translate(-50%,calc(-100% - 12px));z-index:2}
.legende-graph{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--encre-2);align-items:center}
.legende-graph svg{vertical-align:-1px;margin-right:5px}
.resume-graph{font-size:14px;color:var(--encre-2);margin:2px 0 6px}
.valeurs summary{cursor:pointer;font-size:13px;color:var(--lagon-fort);margin-top:6px}
.valeurs table{border-collapse:collapse;margin-top:6px;font-size:14px}
.valeurs th,.valeurs td{padding:3px 16px 3px 0;text-align:left;font-weight:normal;border-bottom:1px solid var(--trait)}

/* Factures */
.lignes{width:100%;border-collapse:collapse}
.lignes th{font-size:13px;color:var(--encre-2);font-weight:normal;text-align:left;padding:0 8px 6px 0}
.lignes td{padding:4px 8px 4px 0;vertical-align:top}
.lignes .num-col{width:96px}
.lignes .total-col{width:96px;text-align:right;padding-top:12px;white-space:nowrap}
.lignes .act-col{width:72px}
.total-ligne{display:flex;justify-content:flex-end;align-items:baseline;gap:16px;font-size:19px;margin:12px 0 2px;font-family:var(--serif)}
.mention-tva{text-align:right;font-size:13px;color:var(--encre-3);margin:0}
.envoi{background:var(--papier-2);border-radius:10px;padding:14px 16px;margin-bottom:22px}
.envoi .aide{margin:10px 0 0;font-size:13.5px}
.factures{width:100%;border-collapse:collapse}
.factures th,.factures td{text-align:left;padding:10px 12px 10px 0;border-bottom:1px solid var(--trait);vertical-align:top}
.factures th{font-size:13px;color:var(--encre-2);font-weight:normal}
.factures .montant{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.etat-facture.a-regler{color:var(--veille)}

/* Accueil */
.intro{font-size:17px;color:var(--encre-2);max-width:60ch;margin:10px 0 20px}
.liste-simple{list-style:none;margin:0;padding:0}
.liste-simple li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;padding:9px 0;border-top:1px solid var(--trait)}
.liste-simple a{color:inherit;font-weight:600;text-decoration:none}
.liste-simple a:hover{color:var(--lagon-fort)}

/* Fenêtres */
dialog{border:0;padding:0;border-radius:12px;background:var(--papier);color:var(--encre);width:min(800px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto;box-shadow:0 24px 64px rgba(8,28,28,.28)}
dialog.etroit{width:min(480px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(12,28,28,.45)}
.dlg-tete{position:sticky;top:0;z-index:3;background:var(--papier);padding:18px 24px 12px;border-bottom:1px solid var(--trait)}
.dlg-tete h2{font-family:var(--serif);font-weight:normal;font-size:24px}
.dlg-tete .sous{margin:2px 0 0}
.dlg-corps{padding:18px 24px 6px}
.dlg-pied{position:sticky;bottom:0;z-index:3;background:var(--papier);padding:12px 24px;border-top:1px solid var(--trait);display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center}
.dlg-pied .espace{flex:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:var(--encre);color:var(--papier);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px);z-index:10}
.toast.visible{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Téléphone */
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  body.vue-fiche .barre{display:none}
  body:not(.vue-fiche) .principal{display:none}
  .retour{display:inline-flex}
  .page{padding:14px 16px 56px}
  .grille.g4,.grille.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fiche-nom{font-size:29px}
  .cases{grid-template-columns:minmax(0,1fr)}
  .rep{grid-template-columns:minmax(0,1fr)}
  .carte-corps{grid-template-columns:minmax(0,1fr)}
  .dlg-tete,.dlg-corps,.dlg-pied{padding-left:16px;padding-right:16px}
  dialog{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0;margin:0}
  dialog.etroit{width:100vw;max-width:100vw}
  dialog[open]{display:flex;flex-direction:column}
  dialog[open] > form{display:flex;flex-direction:column;flex:1 0 auto}
  .dlg-corps{flex:1 0 auto}
  .lignes thead{display:none}
  .lignes tr{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;padding:8px 0;border-bottom:1px solid var(--trait)}
  .lignes td{padding:0}
  .lignes td:first-child{grid-column:1/-1}
  .lignes .total-col{padding-top:8px}
  .lignes .act-col{grid-column:1/-1;width:auto}
}
@media (max-width:480px){
  .grille,.grille.g4,.grille.g3{grid-template-columns:minmax(0,1fr)}
  .factures .col-presta{display:none}
}

/* Synchronisation */
.sync-options{display:grid;gap:10px;margin:4px 0 16px}
.sync-option{font:inherit;color:inherit;text-align:left;display:grid;grid-template-columns:40px minmax(0,1fr);gap:2px 14px;align-items:center;background:var(--papier);border:1px solid var(--trait);border-radius:10px;padding:14px 16px;cursor:pointer}
.sync-option:hover{border-color:var(--lagon);background:var(--papier-2)}
.sync-option .ico{grid-row:1/3;width:40px;height:40px;border-radius:10px;background:var(--lagon-clair);color:var(--lagon-fort);display:grid;place-items:center}
.sync-option strong{font-weight:600}
.sync-option .conseil{font-size:12.5px;font-weight:600;color:var(--lagon-fort);margin-left:6px}
.sync-centre{text-align:center}
.sync-centre .aide{margin-left:auto;margin-right:auto}
.qr-cadre{background:#fff;padding:10px;border-radius:12px;width:min(272px,100%);margin:4px auto 14px;box-shadow:0 0 0 1px var(--trait)}
.qr-cadre svg{display:block;width:100%;height:auto}
.viseur{position:relative;width:min(320px,100%);aspect-ratio:1;margin:4px auto 14px;border-radius:14px;overflow:hidden;background:#0c1414}
.viseur video{width:100%;height:100%;object-fit:cover;display:block}
.viseur::after{content:"";position:absolute;inset:14%;border:3px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.28)}
.attente{display:flex;gap:10px;align-items:center;justify-content:center;color:var(--encre-2);margin:10px 0}
.rond{width:16px;height:16px;border-radius:50%;border:2px solid var(--lagon-clair);border-top-color:var(--lagon);animation:tourne .9s linear infinite;flex:none}
@keyframes tourne{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.rond{animation-duration:2.4s}}
.pastille-ok{width:46px;height:46px;border-radius:50%;background:var(--lagon-clair);color:var(--lagon-fort);display:grid;place-items:center;margin:4px auto 12px}
.pastille-ok.erreur{background:var(--alerte-fond);color:var(--alerte)}
.bilan{list-style:none;margin:12px 0 4px;padding:0;text-align:left}
.bilan li{padding:8px 0;border-top:1px solid var(--trait)}
.bilan li:last-child{border-bottom:1px solid var(--trait)}
.btn-synchro svg{flex:none}
.nobr{white-space:nowrap}

/* Impression */
#impression{display:none}
@media print{
  @page{size:A4;margin:14mm 15mm 16mm}
  html,body{height:auto;background:#fff!important;color:#000}
  .app,dialog,.toast{display:none!important}
  #impression{display:block;color:#111;font:10.5pt/1.45 var(--sans)}
  .imp-page{break-after:page}
  .imp-page:last-child{break-after:auto}
  .imp-entete{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #999;padding-bottom:6px;margin-bottom:14px;font-size:8.5pt;color:#444}
  #impression h1{font-family:var(--serif);font-weight:normal;font-size:21pt;margin:4px 0 2px}
  #impression h2{font-size:12pt;margin:16px 0 6px}
  #impression p{margin:0 0 6px}
  .imp-sous{font-size:12pt}
  .imp-champs{display:grid;grid-template-columns:1fr 1fr;gap:7px 26px}
  .imp-champ,.imp-ligne{display:flex;gap:6px;align-items:baseline}
  .imp-ligne{margin-top:5px}
  .imp-champ .val,.imp-ligne .val{flex:1;border-bottom:1px dotted #777;min-height:1.35em}
  .imp-q{margin:6px 0 8px;break-inside:avoid}
  .imp-cases{columns:2;column-gap:26px;margin:3px 0}
  .imp-cases.trois{columns:3}
  .imp-cases div{break-inside:avoid}
  .imp-signature{display:flex;align-items:flex-end;gap:10px;margin-top:16px}
  .imp-signature .val{flex:1;border-bottom:1px solid #777;min-height:2.6em}
  #impression table{border-collapse:collapse;width:100%;font-size:9.5pt;margin:4px 0 10px}
  #impression th,#impression td{border-bottom:1px solid #bbb;padding:4px 8px 4px 0;text-align:left;vertical-align:top}
  #impression ul{margin:3px 0 10px;padding-left:20px}
  .imp-cadre{border:1px solid #999;padding:8px 12px;margin:16px 0 0;break-inside:avoid}
  .imp-alerte{border-left:3px solid #000;padding-left:10px;margin:8px 0}
  .imp-on{display:grid;grid-template-columns:auto 1fr;gap:12px;margin:3px 0;break-inside:avoid}
  .imp-on .boites{white-space:nowrap}
  .imp-lignes span{display:block;border-bottom:1px dotted #777;height:1.65em}
  .imp-texte{white-space:pre-line;border-bottom:1px dotted #777;padding-bottom:2px}
  .imp-note{font-size:9.5pt;color:#333;margin-top:12px}
}

<script>

/* =========================================================
   Petits outils
   ========================================================= */
const $ = (s, el = document) => el.querySelector(s);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = x => JSON.parse(JSON.stringify(x));
const pad = (n, l = 2) => String(n).padStart(l, '0');
function uid(){ try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {} return Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
function aujourdhui(){ const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function versDate(s){ if (!s || !/^\d{4}-\d{2}-\d{2}/.test(s)) return null; const [y,m,d] = s.slice(0,10).split('-').map(Number); return new Date(y, m-1, d); }

function joursDepuis(s){ const d = versDate(s); if (!d) return null; return Math.round((versDate(aujourdhui()) - d) / 86400000); }
function age(s){ const d = versDate(s); if (!d) return null; const t = new Date(); let a = t.getFullYear() - d.getFullYear(); if (t.getMonth() < d.getMonth() || (t.getMonth() === d.getMonth() && t.getDate() < d.getDate())) a--; return a >= 0 && a < 130 ? a : null; }
function num(v){ if (v == null) return null; const t = String(v).replace(/[\s  ]/g, '').replace(',', '.'); if (t === '') return null; const n = Number(t); return Number.isFinite(n) ? n : null; }
function fmtNum(n){ return n == null ? '' : Number(n).toLocaleString('fr-FR', {maximumFractionDigits:2}); }
function eur(n){ return n == null || !Number.isFinite(Number(n)) ? '' : Number(n).toLocaleString('fr-FR', {style:'currency', currency:'EUR'}); }
function normal(s){ return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim(); }
function majuscule(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function tronquer(s, n){ s = String(s || ''); return s.length > n ? s.slice(0, n - 1).trimEnd() + '…' : s; }

const COLLECTIONS = Fusion.COLLECTIONS;
function etatVide(){
  return { application:'carnet-drainage', version:2, clients:[], questionnaires:[], seances:[], factures:[],
    supprimes:{clients:{}, questionnaires:{}, seances:{}, factures:{}},
    reglages:{ emetteur:{nom:'', commercial:'', adresse:'', siret:'', tel:'', email:'', tva:TVA_DEFAUT, assurance:''},
      tarifs: TYPES.map(t => ({id:uid(), designation:t, prix:null})), signature:'', majLe:null,
      derniereSauvegarde:null, derniereModif:null, derniereSynchro:null, synchroAvec:'' },
    enregistreLe:null };
}
function normaliser(x){
  const e = etatVide();
  if (!x || typeof x !== 'object') return e;
  for (const k of COLLECTIONS) e[k] = Array.isArray(x[k]) ? x[k].filter(r => r && typeof r === 'object') : [];
  for (const k of COLLECTIONS) { const s = x.supprimes && x.supprimes[k]; e.supprimes[k] = s && typeof s === 'object' ? {...s} : {}; }
  const r = x.reglages || {};
  e.reglages = { ...e.reglages, ...r, emetteur:{ ...e.reglages.emetteur, ...(r.emetteur || {}) }, tarifs: Array.isArray(r.tarifs) ? r.tarifs : e.reglages.tarifs };
  e.enregistreLe = x.enregistreLe || null;
  return e;
}
// Carnets créés avant la synchro : date les réglages déjà remplis pour qu'ils ne soient pas écrasés par des réglages vides
function migrer(e){
  const r = e.reglages;
  if (!r.majLe) {
    const rempli = Object.entries(r.emetteur || {}).some(([k, v]) => k !== 'tva' && v) || !!r.signature || (r.tarifs || []).some(t => t.prix != null);
    if (rempli) r.majLe = e.enregistreLe || r.derniereModif || new Date().toISOString();
  }
  return e;
}
// Suppression mémorisée, pour que l'élément ne revienne pas à la prochaine synchro
function oublier(collection, ids){
  const t = new Date().toISOString();
  const liste = new Set([].concat(ids));
  etat[collection] = etat[collection].filter(x => !liste.has(x.id));
  liste.forEach(id => { etat.supprimes[collection][id] = t; });
}

const BASE = 'carnet-drainage', MAGASIN = 'donnees', CLE = 'etat', CLE_LS = 'carnet-drainage-etat';
let idb = null, lsDispo = false, minuteur = null;
function ouvrirIDB(){ return new Promise((res, rej) => { try { const r = indexedDB.open(BASE, 1); r.onupgradeneeded = () => r.result.createObjectStore(MAGASIN); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }); }
function idbLire(cle = CLE){ return new Promise((res, rej) => { const q = idb.transaction(MAGASIN, 'readonly').objectStore(MAGASIN).get(cle); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
function idbEcrire(v, cle = CLE){ return new Promise((res, rej) => { const t = idb.transaction(MAGASIN, 'readwrite'); t.objectStore(MAGASIN).put(v, cle); t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); }

async function charger(){
  let a = null, b = null;
  try { idb = await ouvrirIDB(); const v = await idbLire(); if (v) a = JSON.parse(v); } catch (e) { idb = null; }
  try { localStorage.setItem(CLE_LS + '-test', '1'); localStorage.removeItem(CLE_LS + '-test'); lsDispo = true; const v = localStorage.getItem(CLE_LS); if (v) b = JSON.parse(v); } catch (e) { lsDispo = false; }
  const meilleur = [a, b].filter(Boolean).sort((x, y) => String(y.enregistreLe || '').localeCompare(String(x.enregistreLe || '')))[0];
  if (meilleur) etat = migrer(normaliser(meilleur));
  statutStockage = (idb || lsDispo) ? 'ok' : 'erreur';
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
}
function enregistrer(modif = true){
  if (modif) etat.reglages.derniereModif = new Date().toISOString();

  minuteur = setTimeout(ecrireMaintenant, 250);
}
async function ecrireMaintenant(){
  clearTimeout(minuteur); minuteur = null;
  etat.enregistreLe = new Date().toISOString();
  const json = JSON.stringify(etat);
  let ok = false;
  if (lsDispo) { try { localStorage.setItem(CLE_LS, json); ok = true; } catch (e) {} }
  if (idb) { try { await idbEcrire(json); ok = true; } catch (e) {} }
  statutStockage = ok ? 'ok' : 'erreur';
  majPied();
  try { if (canalFenetres) canalFenetres.postMessage({type:'maj'}); } catch (e) {}
}

function alertesQuestionnaire(q){
  const out = [];
  if (!q) return out;
  const parId = Object.fromEntries(q.reponses.map(r => [r.id, r]));
  for (const r of q.reponses) {
    if (r.type === 'cases') {
      for (const v of r.value || []) { const op = (r.options || []).find(x => x.v === v); if (op && op.niveau) out.push({niveau:op.niveau, texte:v}); }
      if (r.autreValeur && r.autreNiveau) out.push({niveau:r.autreNiveau, texte:`${r.autre} : ${r.autreValeur}`});
    } else if (r.type === 'choix') {
      const op = (r.options || []).find(x => x.v === r.value);
      if (op && op.niveau) { let t = r.value; const sem = parId.semaines && parId.semaines.value; if (r.id === 'grossesse' && sem) t += ` (${sem}${/sem/i.test(sem) ? '' : ' semaines'})`; out.push({niveau:op.niveau, texte:t}); }
    } else if (r.type === 'ouinon' && r.value === 'oui' && r.niveauOui) {
      const p = (r.precisions || []).map(x => r.reponsesPrecisions && r.reponsesPrecisions[x.id]).filter(Boolean).join(', ');
      out.push({niveau:r.niveauOui, texte:(r.court || r.label) + (p ? ` : ${p}` : '')});
    } else if (r.type === 'texteLong' && r.niveauSiRempli && r.value) {
      out.push({niveau:r.niveauSiRempli, texte:`${r.court || r.label} : ${r.value}`});
    }
  }
  return out;
}
const alertesDe = id => alertesQuestionnaire(dernierQuestionnaire(id));
function consentementIncomplet(q){
  if (!q) return false;
  return q.reponses.some(r => (r.type === 'engagements' && (r.value || []).length < (r.options || []).length) || (r.type === 'accord' && !r.value));
}

function majPied(){
  const st = $('#statut');
  if (statutStockage === 'ok') { st.className = 'statut'; st.textContent = 'Enregistré sur cet appareil'; }
  else if (statutStockage === 'erreur') { st.className = 'statut erreur'; st.textContent = "Le navigateur bloque l'enregistrement : fais une sauvegarde maintenant."; }
  else { st.className = 'statut attente'; st.textContent = 'Chargement…'; }
  const info = $('#sauvegardeInfo');
  const r = etat.reglages;
  const aDesDonnees = etat.clients.length > 0;
  if (!aDesDonnees) { info.textContent = ''; info.className = 'sous'; return; }
  const quand = d => { const j = Math.floor((Date.now() - new Date(d)) / 86400000); return j <= 0 ? "aujourd'hui" : j === 1 ? 'hier' : `il y a ${j} jours`; };
  const morceaux = [];
  if (r.derniereSynchro) morceaux.push(`Synchronisé ${quand(r.derniereSynchro)}`);
  if (r.derniereSauvegarde) morceaux.push(`${morceaux.length ? 'sauvegardé' : 'Sauvegardé'} ${quand(r.derniereSauvegarde)}`);
  const protege = [r.derniereSauvegarde, r.derniereSynchro].filter(Boolean).sort().pop();
  if (!protege) { info.textContent = 'Pas encore synchronisé ni sauvegardé'; info.className = 'sous retard'; return; }
  const modifApres = r.derniereModif && r.derniereModif > protege;
  info.textContent = morceaux.join(', ');
  info.className = 'sous' + (modifApres && Date.now() - new Date(protege) >= 7 * 86400000 ? ' retard' : '');
}

function htmlOnglet(c){

  if (ui.onglet === 'seances') return htmlSeances(c);
  if (ui.onglet === 'factures') return htmlFactures(c);
  return htmlIdentite(c);

function htmlEntete(c){
  const a = age(c.naissance);
  const ss = seancesDe(c.id);
  const meta = [];
  if (a !== null) meta.push(`<span>${a} ans</span>`);
  if (c.pronoms && c.pronoms.trim()) meta.push(`<span>${esc(c.pronoms.trim())}</span>`);

function sectionsDepuisReponses(reps){
  const out = [];
  for (const r of reps) {
    let s = out.find(x => x.titre === r.section);

    const q = clone(r); delete q.value; delete q.autreValeur; delete q.reponsesPrecisions; delete q.section;
    s.questions.push(q);
  }
  return out;
}

// Réponses d'une section ; les listes de questions Oui / Non (antécédents) sont regroupées : d'abord les « Oui », puis les « Non »
function htmlReponses(reps){
  const plein = r => ['engagements','accord'].includes(r.type);
  const ligne = r => `<div class="rep${plein(r) ? ' plein' : ''}">${plein(r) ? '' : `<dt>${esc(r.label)}</dt>`}<dd>${htmlValeur(r)}</dd></div>`;

  const nom = r => esc(r.court || r.label);

  let h = `<div class="rep"><dt>Oui</dt><dd>${oui.length ? `<div style="display:grid;gap:8px">${oui.map(r => `<div><span class="puce ${r.niveauOui || ''}">${nom(r)}</span>${htmlPrecisions(r)}</div>`).join('')}</div>` : '<span class="non-rens">Aucune réponse « Oui »</span>'}</dd></div>`;

function htmlAnnexe(M){
  const a = M && M.annexe;
  if (!a) return '';
  return `<div class="annexe"><p>${esc(a.intro)}</p>${a.listes.map(l => `<p style="margin:10px 0 0"><strong>${esc(l.titre)}</strong></p><ul>${l.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>`).join('')}<p style="margin:0">${esc(a.avertissement)}</p></div>`;

function lireQuestionnaire(form, sections){
  const fd = new FormData(form);
  const out = [];
  for (const s of sections) for (const qd of s.questions) {
    const n = 'q_' + qd.id;
    const r = Object.assign(clone(qd), {section:s.titre});
    if (qd.type === 'cases' || qd.type === 'engagements') r.value = fd.getAll(n).map(String);
    else if (qd.type === 'accord') r.value = fd.get(n) != null;
    else r.value = String(fd.get(n) || '').trim();
    if (qd.autre) r.autreValeur = String(fd.get(n + '__autre') || '').trim();
    if (qd.precisions) r.reponsesPrecisions = Object.fromEntries(qd.precisions.map(p => [p.id, qd.precisionsSiOui && r.value !== 'oui' ? '' : String(fd.get(`${n}__${p.id}`) || '').trim()]));
    out.push(r);
  }
  return out;
}
function enregistrerQuestionnaire(form){
  const c = client(ui.clientId); const m = ui.questMode;
  const q = m.id ? etat.questionnaires.find(x => x.id === m.id) : null;
  const sections = structureDe(q);
  const date = form.elements.__date.value;
  if (!date) { const e = $('#questErreur'); e.textContent = 'Indique la date du questionnaire.'; e.hidden = false; form.elements.__date.focus(); return; }
  const reponses = lireQuestionnaire(form, sections);
  const maintenant = new Date().toISOString();
  if (q) Object.assign(q, {date, reponses, majLe:maintenant});
  else etat.questionnaires.push({id:uid(), clientId:c.id, date, modeleId:MODELE.id, modeleNom:MODELE.nom, reponses, creeLe:maintenant, majLe:maintenant});
  ui.questMode = null; ui.questVue = null;
  enregistrer();
  render();
  toast('Questionnaire enregistré');
}

/* Graphique d'évolution des mesures */
function donneesMesures(ss){
  const asc = ss.slice().reverse();
  return MESURES.map(([k, l]) => ({k, l, data:asc.map(s => ({date:s.date, avant:s.mesures && s.mesures.avant ? s.mesures.avant[k] ?? null : null, apres:s.mesures && s.mesures.apres ? s.mesures.apres[k] ?? null : null})).filter(d => d.avant != null || d.apres != null)})).filter(m => m.data.length >= 2);
}
function htmlEvolution(ss){
  const ms = donneesMesures(ss);
  if (!ms.length) return '';
  const m = ms.find(x => x.k === ui.mesure) || ms[0];
  const ref = d => d.avant != null ? d.avant : d.apres;
  const prem = m.data[0], der = m.data[m.data.length - 1];
  const delta = ref(der) - ref(prem);
  const resume = `${fmtNum(ref(prem))} cm le ${fmtDate(prem.date, {day:'numeric', month:'long'})}, ${fmtNum(ref(der))} cm le ${fmtDate(der.date, {day:'numeric', month:'long'})} : ${delta === 0 ? 'stable' : (delta > 0 ? '+' : '−') + fmtNum(Math.abs(delta)) + ' cm'}.`;
  return `<section class="graph-zone" aria-label="Évolution des mesures">
    <div class="graph-tete"><strong>Évolution des mesures</strong>
      <label class="sous">Mesure <select id="choixMesure">${ms.map(x => `<option value="${x.k}"${x.k === m.k ? ' selected' : ''}>${esc(x.l)}</option>`).join('')}</select></label></div>
    <p class="resume-graph">${esc(m.l)} : ${esc(resume)}</p>
    ${svgGraph(m)}
    <div class="legende-graph"><span><svg width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="var(--lagon)"/></svg>Avant la séance</span><span><svg width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="4" fill="var(--papier)" stroke="var(--lagon)" stroke-width="2"/></svg>Après la séance</span></div>
    <details class="valeurs"><summary>Voir les valeurs</summary><table><thead><tr><th>Date</th><th>Avant</th><th>Après</th></tr></thead><tbody>${m.data.map(d => `<tr><td>${fmtDate(d.date)}</td><td>${d.avant != null ? fmtNum(d.avant) + ' cm' : ''}</td><td>${d.apres != null ? fmtNum(d.apres) + ' cm' : ''}</td></tr>`).join('')}</tbody></table></details>
    <div class="infobulle" id="infobulle" hidden></div></section>`;
}
function svgGraph(m){
  const W = 640, H = 220, ml = 44, mr = 20, mt = 14, mb = 30, iw = W - ml - mr, ih = H - mt - mb;
  const vals = m.data.flatMap(d => [d.avant, d.apres]).filter(v => v != null);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 2) { const c = (hi + lo) / 2; lo = c - 1; hi = c + 1; }
  const marge = (hi - lo) * 0.15; lo -= marge; hi += marge;
  const pas = [0.5, 1, 2, 5, 10, 20, 50].find(p => (hi - lo) / p <= 5) || 100;
  const ticks = []; for (let v = Math.ceil(lo / pas) * pas; v <= hi + 1e-9; v += pas) ticks.push(Math.round(v * 100) / 100);
  const ts = m.data.map(d => versDate(d.date).getTime()); const t0 = Math.min(...ts), t1 = Math.max(...ts);
  const X = t => t1 === t0 ? ml + iw / 2 : ml + (t - t0) / (t1 - t0) * iw;
  const Y = v => mt + (hi - v) / (hi - lo) * ih;
  const xs = ts.map(X);
  const lab = [0]; for (let i = 1; i < m.data.length - 1; i++) if (xs[i] - xs[lab[lab.length - 1]] >= 72 && xs[m.data.length - 1] - xs[i] >= 72) lab.push(i);
  if (m.data.length > 1) lab.push(m.data.length - 1);
  const pts = m.data.map((d, i) => ({...d, x:xs[i]}));
  const ligne = pts.filter(p => p.avant != null).map((p, i) => `${i ? 'L' : 'M'}${p.x.toFixed(1)} ${Y(p.avant).toFixed(1)}`).join(' ');
  const tip = p => `${fmtDate(p.date, {day:'numeric', month:'short', year:'numeric'})} : ${[p.avant != null ? fmtNum(p.avant) + ' cm avant' : null, p.apres != null ? fmtNum(p.apres) + ' cm après' : null].filter(Boolean).join(', ')}`;
  return `<svg class="graph" viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe ${esc(m.l)}">
    ${ticks.map(v => `<line class="g-grille" x1="${ml}" x2="${W - mr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text class="g-axe" x="${ml - 8}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end">${fmtNum(v)}</text>`).join('')}
    ${lab.map((i, j) => `<text class="g-axe" x="${xs[i].toFixed(1)}" y="${H - 8}" text-anchor="${lab.length > 1 && j === 0 ? 'start' : lab.length > 1 && j === lab.length - 1 ? 'end' : 'middle'}">${fmtDate(m.data[i].date, {day:'numeric', month:'short'})}</text>`).join('')}
    ${pts.filter(p => p.avant != null && p.apres != null).map(p => `<line class="g-lien" x1="${p.x.toFixed(1)}" x2="${p.x.toFixed(1)}" y1="${Y(p.avant).toFixed(1)}" y2="${Y(p.apres).toFixed(1)}"/>`).join('')}
    ${ligne ? `<path class="g-ligne" d="${ligne}"/>` : ''}
    ${pts.filter(p => p.apres != null).map(p => `<circle class="g-apres" cx="${p.x.toFixed(1)}" cy="${Y(p.apres).toFixed(1)}" r="4.5"/>`).join('')}
    ${pts.filter(p => p.avant != null).map(p => `<circle class="g-avant" cx="${p.x.toFixed(1)}" cy="${Y(p.avant).toFixed(1)}" r="5"/>`).join('')}
    ${pts.map(p => `<circle class="g-cible" cx="${p.x.toFixed(1)}" cy="${Y(p.avant != null ? p.avant : p.apres).toFixed(1)}" r="14" tabindex="0" data-tip="${esc(tip(p))}" aria-label="${esc(tip(p))}"/>`).join('')}
  </svg>`;
}
function brancherGraph(){
  const zone = $('.graph-zone'); if (!zone) return;
  const bulle = $('#infobulle', zone);
  const montrer = el => { const r = el.getBoundingClientRect(), z = zone.getBoundingClientRect(); bulle.textContent = el.dataset.tip; bulle.style.left = (r.left + r.width / 2 - z.left) + 'px'; bulle.style.top = (r.top + r.height / 2 - z.top - 4) + 'px'; bulle.hidden = false; };
  $$('.g-cible', zone).forEach(el => { el.addEventListener('pointerenter', () => montrer(el)); el.addEventListener('focus', () => montrer(el)); el.addEventListener('pointerleave', () => { bulle.hidden = true; }); el.addEventListener('blur', () => { bulle.hidden = true; }); });
}

  [e.commercial, ...String(e.adresse || '').split(/\r?\n/), e.tel ? `Tél. ${e.tel}` : '', e.email, e.siret ? `SIRET ${e.siret}` : ''].filter(x => x && x.trim()).forEach(l => { p.texte(M, y, l.trim(), {taille:9.5, couleur:gris}); y -= 13; });
  p.texte(W - M, H - 72, 'Facture', {taille:26, gras:true, align:'right', couleur:lagon});
  p.texte(W - M, H - 92, `N° ${f.numero}`, {taille:11, gras:true, align:'right'});
  p.texte(W - M, H - 107, `Date : ${fmtDate(f.dateEmission)}`, {taille:10, align:'right', couleur:gris});
  let yc = Math.min(y, H - 140) - 18;
  const xc = W - M - 210;
  p.texte(xc, yc, 'Facturé à', {taille:9, couleur:gris}); yc -= 15;
  p.texte(xc, yc, cl.nom, {taille:11, gras:true}); yc -= 14;
  (cl.adresse || []).forEach(l => { couperTexte(l, 210, 10).forEach(t => { p.texte(xc, yc, t, {taille:10}); yc -= 13; }); });
  y = Math.min(y, yc) - 34;
  const cQ = W - M - 196, cPU = W - M - 96, cT = W - M - 8;
  p.rect(M, y - 7, W - 2 * M, 22, '0.92 0.95 0.945');
  p.texte(M + 8, y, 'Désignation', {taille:9.5, gras:true});
  p.texte(cQ, y, 'Qté', {taille:9.5, gras:true, align:'right'});
  p.texte(cPU, y, 'Prix unitaire', {taille:9.5, gras:true, align:'right'});
  p.texte(cT, y, 'Total', {taille:9.5, gras:true, align:'right'});
  y -= 27;
  for (const l of f.lignes) {
    const ls = couperTexte(l.designation, cQ - 50 - (M + 8), 10);
    ls.forEach((t, i) => p.texte(M + 8, y - i * 13, t, {taille:10}));
    p.texte(cQ, y, fmtNum(l.quantite), {taille:10, align:'right'});
    p.texte(cPU, y, eur(l.prix), {taille:10, align:'right'});
    p.texte(cT, y, eur(l.quantite * l.prix), {taille:10, align:'right'});
    y -= (ls.length - 1) * 13 + 12;
    p.ligne(M, y, W - M, y);
    y -= 15;
  }
  y -= 6;
  p.texte(cPU, y, 'Total à payer', {taille:11, gras:true, align:'right'});
  p.texte(cT, y, eur(f.total), {taille:12.5, gras:true, align:'right'});
  y -= 16;
  p.texte(cT, y, e.tva || '', {taille:9, align:'right', couleur:gris});
  y -= 40;
  const infos = [ f.datePrestation ? `Date de la prestation : ${fmtDate(f.datePrestation)}` : '',
    f.statut === 'reglee' ? `Facture réglée${f.dateReglement ? ' le ' + fmtDate(f.dateReglement) : ''}${f.moyen ? ' par ' + f.moyen.toLowerCase() : ''}.` : 'Facture à régler à réception.',
    f.note, e.assurance ? `Assurance professionnelle : ${e.assurance}` : '' ].filter(Boolean);
  infos.forEach(t => couperTexte(t, W - 2 * M, 10).forEach(l => { p.texte(M, y, l, {taille:10}); y -= 14; }));
  p.ligne(M, 54, W - M, 54);
  p.texte(W / 2, 40, [`${e.nom || ''} EI`.trim(), e.siret ? `SIRET ${e.siret}` : '', e.tva].filter(Boolean).join('  -  '), {taille:8, align:'center', couleur:gris});
  return p.pdf(`Facture ${f.numero}`);
}

async function importer(fichier){
  try {
    const obj = JSON.parse(await fichier.text());
    if (!obj || !Array.isArray(obj.clients)) throw new Error('format');
    const n = obj.clients.length;
    const msg = etat.clients.length ? `Remplacer les ${etat.clients.length} fiches actuelles par les ${n} fiches de la sauvegarde${obj.exporteLe ? ` du ${fmtDate(obj.exporteLe.slice(0, 10))}` : ''} ? Les données actuelles seront effacées.` : `Restaurer les ${n} fiches de cette sauvegarde ?`;
    if (!confirm(msg)) return;
    etat = migrer(normaliser(obj));
    await ecrireMaintenant();
    location.hash = '#/'; render();
    toast(`Sauvegarde restaurée : ${n} fiche${n > 1 ? 's' : ''}`);

/* =========================================================
   Synchronisation directe entre deux appareils
   ---------------------------------------------------------
   Un appareil affiche un QR code : adresse de l'appli, identifiant de rendez-vous
   et clé secrète à usage unique (AES-GCM 128 bits). L'autre le scanne.
   Des services publics gratuits servent seulement à relayer les messages de
   connexion WebRTC, chiffrés avec la clé, qu'ils ne voient jamais : le serveur
   PeerJS et, en secours, deux relais MQTT publics (EMQX, HiveMQ). L'appareil qui
   affiche le QR code écoute sur tous ceux qui répondent et les indique dans le
   QR code ; l'autre utilise le premier qu'il arrive à joindre. Les fiches passent
   ensuite directement d'un appareil à l'autre, chiffrées une seconde fois avec la clé.
   Pas de serveur relais (TURN) : si les appareils ne peuvent pas se joindre
   directement, la synchro échoue plutôt que de faire transiter les données ailleurs.
   ========================================================= */
const SYNC = {
  serveur:'wss://0.peerjs.com:443/peerjs', cleServeur:'peerjs',
  relais:[{code:'e', url:'wss://broker.emqx.io:8084/mqtt'}, {code:'h', url:'wss://broker.hivemq.com:8884/mqtt'}],
  sujet:'carnet-drainage/v1/',
  ice:[{urls:'stun:stun.l.google.com:19302'}, {urls:'stun:stun.cloudflare.com:3478'}],
  protocole:1, morceau:15000
};
try { if (window.__configSynchro) Object.assign(SYNC, window.__configSynchro); } catch (e) {}
const pause = ms => new Promise(r => setTimeout(r, ms));
function erreurSync(code){ const e = new Error(code); e.code = code; return e; }
function typeAppareil(){ const ua = navigator.userAgent || ''; if (/iPad|Tablet/i.test(ua) || (/Android/i.test(ua) && !/Mobile/i.test(ua))) return 'tablette'; if (/Android|iPhone|iPod|Mobile/i.test(ua)) return 'telephone'; return 'ordinateur'; }
const NOMS_APPAREILS = {telephone:'ton téléphone', ordinateur:'ton ordinateur', tablette:'ta tablette'};
const nomAppareil = t => NOMS_APPAREILS[t] || "l'autre appareil";
function aleatoire(n){ return crypto.getRandomValues(new Uint8Array(n)); }
function idAleatoire(n){ const a = 'abcdefghijkmnpqrstuvwxyz23456789'; return Array.from(aleatoire(n), b => a[b % 32]).join(''); }
function versB64u(u8){ let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function depuisB64u(t){ const b = String(t).replace(/-/g, '+').replace(/_/g, '/'); const s = atob(b + '='.repeat((4 - b.length % 4) % 4)); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
function importerCle(brute){ return crypto.subtle.importKey('raw', brute, {name:'AES-GCM'}, false, ['encrypt', 'decrypt']); }
async function chiffrer(cle, objet){ const iv = aleatoire(12); const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, cle, new TextEncoder().encode(JSON.stringify(objet)))); const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return versB64u(out); }
async function dechiffrer(cle, texte){ const u = depuisB64u(texte); const clair = await crypto.subtle.decrypt({name:'AES-GCM', iv:u.subarray(0, 12)}, cle, u.subarray(12)); return JSON.parse(new TextDecoder().decode(clair)); }
async function empreinte(x){ const h = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(Fusion.canon(x)))); return Array.from(h, b => b.toString(16).padStart(2, '0')).join(''); }
// Le lien indique aussi les services de mise en relation sur lesquels l'appareil qui affiche le QR code écoute
function lienSynchro(id, brute, canaux){ return `${location.origin}${location.pathname}#synchro=${id}.${versB64u(brute)}${canaux ? '.' + canaux : ''}`; }
function lireLienSynchro(texte){ const m = /#synchro=([a-z0-9]{6,40})\.([A-Za-z0-9_-]{20,64})(?:\.([a-z]{1,8}))?/.exec(String(texte || '')); return m ? {id:m[1], cle:m[2], canaux:m[3] || 'p'} : null; }
function synchroPossible(){
  if (location.protocol === 'file:' || !window.isSecureContext) return 'hors-https';
  if (!window.RTCPeerConnection || !window.WebSocket || !(window.crypto && crypto.subtle)) return 'non-pris-en-charge';
  return null;
}

// Détail technique gardé pour l'écran d'erreur : quels services ont été essayés et pourquoi ils ont échoué
const NOMS_SERVICES = {p:'PeerJS', e:'EMQX', h:'HiveMQ'};
const DIAG = {role:'', liste:'', services:{}, apres:''};
function diagInit(role, liste){ DIAG.role = role; DIAG.liste = liste || ''; DIAG.services = {}; DIAG.apres = ''; }

// Connexion au serveur de mise en relation (protocole du serveur PeerJS)
class Signal {
  constructor(id, surMessage){ this.id = id; this.surMessage = surMessage; this.ws = null; this.ouvert = false; this.ferme = false; this.battement = null; this.surCoupure = null; this.motif = ''; }
  ouvrir(){
    return new Promise((ok, ko) => {
      let ws;
      try { ws = new WebSocket(`${SYNC.serveur}?key=${encodeURIComponent(SYNC.cleServeur)}&id=${this.id}&token=${idAleatoire(12)}&version=1.5.4`); }
      catch (e) { this.motif = 'ouverture impossible'; ko(erreurSync('reseau')); return; }
      this.ws = ws;
      const delai = setTimeout(() => { if (!this.motif) this.motif = 'pas de réponse en 12 s'; ko(erreurSync('reseau')); this.fermer(); }, 12000);
      ws.onmessage = ev => {
        let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
        if (m.type === 'OPEN') { clearTimeout(delai); this.ouvert = true; this.battement = setInterval(() => this.envoyer({type:'HEARTBEAT'}), 5000); ok(); return; }
        if (m.type === 'ID-TAKEN' || m.type === 'ERROR') { clearTimeout(delai); this.motif = m.type === 'ID-TAKEN' ? 'identifiant déjà pris' : 'erreur renvoyée par le serveur'; ko(erreurSync(m.type === 'ID-TAKEN' ? 'id-pris' : 'reseau')); this.fermer(); return; }
        if (m.type !== 'HEARTBEAT') this.surMessage(m);
      };
      ws.onerror = () => {};
      ws.onclose = ev => { clearTimeout(delai); clearInterval(this.battement); const etaitOuvert = this.ouvert; this.ouvert = false; if (!etaitOuvert) { if (!this.motif) this.motif = 'connexion refusée ou coupée (code ' + (ev && ev.code) + ')'; ko(erreurSync('reseau')); } else if (!this.ferme && this.surCoupure) this.surCoupure(); };
    });
  }
  envoyer(m){ try { if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify(m)); } catch (e) {} }
  fermer(){ this.ferme = true; clearInterval(this.battement); try { if (this.ws) this.ws.close(); } catch (e) {} }
}

// Mise en relation de secours par un relais MQTT public (MQTT 3.1.1 sur WebSocket, QoS 0).
// Chaque appareil s'abonne au sujet portant son identifiant ; les messages, déjà chiffrés, y sont déposés.
const octets = (...parts) => { const n = parts.reduce((t, x) => t + x.length, 0), out = new Uint8Array(n); let i = 0; for (const x of parts) { out.set(x, i); i += x.length; } return out; };
const chaineMqtt = t => { const b = new TextEncoder().encode(t); return octets([b.length >> 8, b.length & 255], b); };
function longueurMqtt(n){ const out = []; do { let o = n % 128; n = Math.floor(n / 128); if (n > 0) o |= 128; out.push(o); } while (n > 0); return out; }
class SignalMqtt {
  constructor(id, surMessage, url){ this.id = id; this.surMessage = surMessage; this.url = url; this.ws = null; this.ouvert = false; this.ferme = false; this.battement = null; this.surCoupure = null; this.tampon = new Uint8Array(0); this.motif = ''; }
  ouvrir(){
    return new Promise((ok, ko) => {
      let ws, fini = false, delai = null;
      const rate = motif => { if (fini) return; fini = true; clearTimeout(delai); if (motif && !this.motif) this.motif = motif; ko(erreurSync('reseau')); this.fermer(); };
      try { ws = new WebSocket(this.url, ['mqtt']); ws.binaryType = 'arraybuffer'; }
      catch (e) { this.motif = 'ouverture impossible'; ko(erreurSync('reseau')); return; }
      this.ws = ws;
      delai = setTimeout(() => rate('pas de réponse en 10 s'), 10000);
      ws.onopen = () => this.paquet(0x10, octets(chaineMqtt('MQTT'), [4, 2, 0, 60], chaineMqtt('cd' + idAleatoire(18))));
      ws.onmessage = ev => {
        let paquets; try { paquets = this.lire(new Uint8Array(ev.data)); } catch (e) { rate('réponse illisible'); return; }
        for (const [entete, corps] of paquets) {
          const type = entete >> 4;
          if (type === 2) { if (corps[1] !== 0) return rate('connexion refusée par le relais'); this.paquet(0x82, octets([0, 1], chaineMqtt(SYNC.sujet + this.id), [0])); }
          else if (type === 9 && !fini) {
            if (corps[2] === 0x80) return rate('abonnement refusé par le relais');
            fini = true; clearTimeout(delai); this.ouvert = true;
            this.battement = setInterval(() => this.paquet(0xC0, []), 20000);
            ok();
          } else if (type === 3) {
            const n = (corps[0] << 8) | corps[1], qos = (entete >> 1) & 3;
            let m; try { m = JSON.parse(new TextDecoder().decode(corps.subarray(2 + n + (qos ? 2 : 0)))); } catch (e) { continue; }
            if (m && typeof m === 'object' && typeof m.type === 'string' && m.src !== this.id) this.surMessage(m);
          }
        }
      };
      ws.onerror = () => {};
      ws.onclose = ev => { clearInterval(this.battement); const etaitOuvert = this.ouvert; this.ouvert = false; if (!etaitOuvert) rate('connexion refusée ou coupée (code ' + (ev && ev.code) + ')'); else if (!this.ferme && this.surCoupure) this.surCoupure(); };
    });
  }
  // Découpe le flux reçu en paquets MQTT (un message WebSocket peut en contenir plusieurs, ou un morceau)
  lire(morceau){
    this.tampon = octets(this.tampon, morceau);
    const out = [];
    for (;;) {
      const t = this.tampon;
      if (t.length < 2) break;
      let rest = 0, mult = 1, i = 1, complet = false;
      for (; i < t.length && i <= 4; i++) { rest += (t[i] & 127) * mult; mult *= 128; if (!(t[i] & 128)) { complet = true; i++; break; } }
      if (!complet) { if (i > 4) throw new Error('paquet'); break; }
      if (t.length < i + rest) break;
      out.push([t[0], t.slice(i, i + rest)]);
      this.tampon = t.slice(i + rest);
    }
    return out;
  }
  paquet(entete, corps){ try { if (this.ws && this.ws.readyState === 1) this.ws.send(octets([entete], longueurMqtt(corps.length), corps)); } catch (e) {} }
  envoyer(m){ if (this.ouvert && m && m.dst) this.paquet(0x30, octets(chaineMqtt(SYNC.sujet + m.dst), new TextEncoder().encode(JSON.stringify({type:m.type, src:this.id, payload:m.payload})))); }
  fermer(){ this.ferme = true; clearInterval(this.battement); this.paquet(0xE0, []); this.ouvert = false; try { if (this.ws) this.ws.close(); } catch (e) {} }
}

// Services de mise en relation, dans l'ordre de préférence : p = PeerJS, puis les relais MQTT
function canauxSignal(){
  return [{code:'p', cree:(id, f) => new Signal(id, f)}].concat((SYNC.relais || []).map(r => ({code:r.code, cree:(id, f) => new SignalMqtt(id, f, r.url)})));
}
// Appareil qui affiche le QR code : écoute sur tous les services joignables et répond par celui que l'autre appareil a utilisé
class SignalHote {
  constructor(id, surMessage){ this.id = id; this.surMessage = surMessage; this.actifs = []; this.route = new Map(); this.surCoupure = null; this.ferme = false; }
  async ouvrir(){
    const depart = Date.now();
    diagInit('hote');
    let peerjsFini = false;
    const essais = canauxSignal().map(async c => {
      const sig = c.cree(this.id, m => { if (m && m.src) this.route.set(m.src, sig); this.surMessage(m); });
      try {
        try { await sig.ouvrir(); } catch (e) { DIAG.services[c.code] = sig.motif || 'échec'; sig.fermer(); return; }
        if (this.ferme) { sig.fermer(); return; }
        DIAG.services[c.code] = 'ok';
        sig.surCoupure = () => { this.actifs = this.actifs.filter(a => a.sig !== sig); if (!this.actifs.length && !this.ferme && this.surCoupure) { DIAG.apres = 'connexion aux services perdue pendant l\'attente'; this.surCoupure(); } };
        this.actifs.push({code:c.code, sig});
      } finally { if (c.code === 'p') peerjsFini = true; }
    });
    // On attend tous les services, ou 4 secondes dès qu'au moins un répond ET que PeerJS (le plus fiable) a répondu ou échoué
    // (12 secondes au plus) : un relais lent ne retarde pas le QR code, mais l'autre appareil retrouve PeerJS dans le QR code s'il fonctionne
    await new Promise(fin => {
      let restants = essais.length;
      const verifier = () => { if (!restants || (peerjsFini && this.actifs.length && Date.now() - depart >= 4000)) fin(); };
      essais.forEach(e => e.finally(() => { restants--; verifier(); }));
      setTimeout(verifier, 4000);
    });
    if (!this.actifs.length) throw erreurSync('reseau');
    return canauxSignal().map(c => c.code).filter(k => this.actifs.some(a => a.code === k)).join('');
  }
  envoyer(m){ const sig = this.route.get(m.dst); if (sig && sig.ouvert) sig.envoyer(m); else this.actifs.forEach(a => a.sig.envoyer(m)); }
  fermer(){ this.ferme = true; this.actifs.forEach(a => a.sig.fermer()); this.actifs = []; }
}
// Appareil qui scanne : essaie ensemble les services indiqués dans le QR code et garde le premier qui répond
function ouvrirSignalInvite(id, surMessage, codes){
  const liste = canauxSignal().filter(c => String(codes || 'p').includes(c.code));
  diagInit('invite', liste.map(c => c.code).join(''));
  if (!liste.length) return Promise.reject(erreurSync('reseau'));
  return new Promise((ok, ko) => {
    let gagnant = null, echecs = 0;
    liste.forEach(c => {
      const sig = c.cree(id, m => { if (sig === gagnant) surMessage(m); });
      sig.ouvrir().then(() => { DIAG.services[c.code] = 'ok'; if (gagnant) { sig.fermer(); return; } gagnant = sig; ok(sig); },
        () => { DIAG.services[c.code] = sig.motif || 'échec'; sig.fermer(); if (++echecs === liste.length) ko(erreurSync('reseau')); });
    });
  });
}

// Une synchronisation : « hote » affiche le QR code, « invite » le scanne
function creerSession(role, rappels){
  const s = {role, fermee:false, applique:false, application:false};
  let signal = null, pc = null, canal = null, cle = null, distant = null, nomDistant = '';
  let candidatsRecus = [], descriptionDistante = false, offreEnvoyee = false, candidatsSortants = [];
  let fileSignal = Promise.resolve(), fileEnvoiSignal = Promise.resolve(), fileCanal = Promise.resolve();
  const morceaux = new Map();
  let finLocale = null, finDistante = null, bilan = null, minuterie = null, termine = false;

  const echec = e => {
    if (s.fermee) return;
    const code = (e && e.code) || 'coupure';
    s.fermer();
    rappels.erreur(code === 'coupure' && s.applique ? 'coupure-apres' : code);
  };
  s.fermer = () => {
    s.fermee = true; clearTimeout(minuterie);
    try { if (canal) canal.close(); } catch (e) {}
    try { if (pc) pc.close(); } catch (e) {}
    if (signal) signal.fermer();
  };
  const armerDelai = ms => { clearTimeout(minuterie); minuterie = setTimeout(() => echec(erreurSync(canal && canal.readyState === 'open' ? 'coupure' : 'injoignable')), ms); };
  const recevoirSignal = m => { fileSignal = fileSignal.then(() => surSignal(m)).catch(echec); };
  const descr = d => ({type:d.type, sdp:d.sdp});

  function envoyerSignal(type, contenu){
    fileEnvoiSignal = fileEnvoiSignal.then(async () => {
      if (!signal || !distant || s.fermee) return;
      signal.envoyer({type, dst:distant, payload:{d:await chiffrer(cle, {...contenu, de:role})}});
    }).catch(() => {});
    return fileEnvoiSignal;
  }
  function nouvellePC(){
    pc = new RTCPeerConnection({iceServers:SYNC.ice});
    pc.onicecandidate = e => {
      if (!e.candidate) return;
      const c = e.candidate.toJSON ? e.candidate.toJSON() : e.candidate;
      if (role === 'invite' && !offreEnvoyee) candidatsSortants.push(c); else envoyerSignal('CANDIDATE', {candidat:c});
    };
    const surEtat = () => { if (pc && (pc.connectionState === 'failed' || pc.iceConnectionState === 'failed')) echec(erreurSync('injoignable')); };
    pc.onconnectionstatechange = surEtat; pc.oniceconnectionstatechange = surEtat;
  }
  async function viderCandidats(){ descriptionDistante = true; const l = candidatsRecus; candidatsRecus = []; for (const c of l) { try { await pc.addIceCandidate(c); } catch (e) {} } }

  async function surSignal(m){
    if (s.fermee) return;
    if (m.type === 'EXPIRE') { if (role === 'invite' && m.src === distant) throw erreurSync('qr-inactif'); return; }
    if (m.type === 'ANSWER' && role === 'invite' && m.src === distant && m.payload && m.payload.refus) throw erreurSync('cle');
    if (!m.payload || typeof m.payload.d !== 'string') return;
    let contenu;
    try { contenu = await dechiffrer(cle, m.payload.d); }
    catch (e) {
      // Message chiffré avec une autre clé : on le signale à l'expéditeur sans rien lui révéler
      if (m.type === 'OFFER' && role === 'hote' && !pc && signal) signal.envoyer({type:'ANSWER', dst:m.src, payload:{refus:true}});
      return;
    }
    if (!contenu || contenu.de === role) return;
    if (m.type === 'OFFER' && role === 'hote') {
      if (pc) return; // une seule synchro à la fois
      distant = m.src;
      rappels.etape('connexion');
      nouvellePC();
      pc.ondatachannel = e => brancherCanal(e.channel);
      await pc.setRemoteDescription(contenu.sdp);
      await viderCandidats();
      await pc.setLocalDescription(await pc.createAnswer());
      await envoyerSignal('ANSWER', {sdp:descr(pc.localDescription)});
      armerDelai(30000);
    } else if (m.type === 'ANSWER' && role === 'invite' && m.src === distant && !descriptionDistante) {
      await pc.setRemoteDescription(contenu.sdp);
      await viderCandidats();
    } else if (m.type === 'CANDIDATE' && pc && m.src === distant && contenu.candidat) {
      if (!descriptionDistante) candidatsRecus.push(contenu.candidat);
      else { try { await pc.addIceCandidate(contenu.candidat); } catch (e) {} }
    }
  }

  function brancherCanal(c){
    canal = c;
    canal.onopen = () => {
      if (s.fermee) return;
      if (signal) { signal.fermer(); signal = null; } // le QR code ne sert plus : il devient inutilisable
      rappels.etape('echange', '');
      armerDelai(60000);
      if (role === 'invite') envoyer({type:'bonjour', proto:SYNC.protocole, appareil:typeAppareil()}).catch(echec);
    };
    canal.onmessage = e => { fileCanal = fileCanal.then(() => recevoir(e.data)).catch(echec); };
    canal.onclose = () => { if (!termine) echec(erreurSync('coupure')); };
    canal.onerror = () => {};
  }
  async function envoyer(objet){
    const texte = await chiffrer(cle, {...objet, de:role});
    const n = Math.max(1, Math.ceil(texte.length / SYNC.morceau)), k = idAleatoire(8);
    for (let i = 0; i < n; i++) {
      while (canal.bufferedAmount > (1 << 20)) { if (s.fermee) return; await pause(25); }
      const d = texte.slice(i * SYNC.morceau, (i + 1) * SYNC.morceau);
      canal.send(JSON.stringify(n === 1 ? {t:'m', d} : {t:'c', k, i, n, d}));
    }
  }
  async function recevoir(brut){
    if (s.fermee || termine) return;
    let m; try { m = JSON.parse(brut); } catch (e) { return; }
    let texte;
    if (m.t === 'm') texte = m.d;
    else if (m.t === 'c' && Number.isInteger(m.i) && Number.isInteger(m.n) && m.n > 0 && m.n < 100000) {
      let e = morceaux.get(m.k);
      if (!e) { e = {n:m.n, parts:new Array(m.n), recus:0}; morceaux.set(m.k, e); }
      if (m.i >= 0 && m.i < e.n && e.parts[m.i] == null) { e.parts[m.i] = m.d; e.recus++; }
      if (e.recus < e.n) return;
      morceaux.delete(m.k); texte = e.parts.join('');
    } else return;
    let msg;
    try { msg = await dechiffrer(cle, texte); } catch (e) { throw erreurSync('cle'); }
    if (!msg || msg.de === role) return;
    armerDelai(60000);
    if (msg.type === 'bonjour') {
      if (msg.proto !== SYNC.protocole) { await envoyer({type:'erreur', code:'version'}).catch(() => {}); throw erreurSync('version'); }
      nomDistant = msg.appareil || '';
      rappels.etape('echange', nomDistant);
      if (role === 'hote') await envoyer({type:'bonjour', proto:SYNC.protocole, appareil:typeAppareil()});
      viderEnAttente();
      await envoyer({type:'etat', etat:Fusion.partage(etat)});
    } else if (msg.type === 'etat') {
      const f = Fusion.fusionner(etat, msg.etat);
      bilan = f.bilan;
      s.application = true;
      await rappels.appliquer(f.resultat, nomDistant);
      s.applique = true; s.application = false;
      finLocale = await empreinte(f.resultat);
      await envoyer({type:'fin', empreinte:finLocale});
      verifier();
    } else if (msg.type === 'fin') { finDistante = msg.empreinte; verifier(); }
    else if (msg.type === 'erreur') throw erreurSync(msg.code === 'version' ? 'version' : 'coupure');
  }
  function verifier(){
    if (!finLocale || !finDistante || termine) return;
    termine = true; clearTimeout(minuterie);
    setTimeout(() => s.fermer(), 1500);
    if (finLocale === finDistante) rappels.fini(bilan, nomDistant); else rappels.erreur('divergence');
  }

  s.preparerHote = async () => {
    const brute = aleatoire(16);
    cle = await importerCle(brute);
    const id = 'cd' + idAleatoire(14);
    const hote = new SignalHote(id, recevoirSignal);
    signal = hote;
    let canaux;
    try { canaux = await hote.ouvrir(); }
    catch (e) { hote.fermer(); if (signal === hote) signal = null; throw e; }
    if (s.fermee) { hote.fermer(); return null; }
    hote.surCoupure = () => { if (!pc) { DIAG.apres = 'connexion aux services perdue pendant l\'attente'; echec(erreurSync('reseau')); } };
    return lienSynchro(id, brute, canaux);
  };
  s.rejoindre = async info => {
    try { const brute = depuisB64u(info.cle); if (brute.length !== 16 && brute.length !== 32) throw 0; cle = await importerCle(brute); }
    catch (e) { throw erreurSync('cle'); }
    distant = info.id;
    const sig = await ouvrirSignalInvite('cd' + idAleatoire(14), recevoirSignal, info.canaux);
    if (s.fermee) { sig.fermer(); return; }
    signal = sig;
    signal.surCoupure = () => { if (!canal || canal.readyState !== 'open') { DIAG.apres = 'connexion aux services perdue avant la réponse de l\'autre appareil'; echec(erreurSync('reseau')); } };
    nouvellePC();
    brancherCanal(pc.createDataChannel('carnet', {ordered:true}));
    await pc.setLocalDescription(await pc.createOffer());
    await envoyerSignal('OFFER', {sdp:descr(pc.localDescription)});
    offreEnvoyee = true;
    candidatsSortants.splice(0).forEach(c => envoyerSignal('CANDIDATE', {candidat:c}));
    armerDelai(30000);
  };
  return s;
}

// Lecture du QR code avec l'appareil photo (détecteur intégré au navigateur)
async function demarrerScan(video, surTexte){
  let detecteur = null;
  if ('BarcodeDetector' in window) { try { const f = await BarcodeDetector.getSupportedFormats(); if (f.includes('qr_code')) detecteur = new BarcodeDetector({formats:['qr_code']}); } catch (e) {} }
  if (!detecteur) throw erreurSync('scan-impossible');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw erreurSync('camera-absente');
  let flux;
  try { flux = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720}}, audio:false}); }
  catch (e) { throw erreurSync(e && (e.name === 'NotAllowedError' || e.name === 'SecurityError') ? 'camera-refusee' : 'camera-absente'); }
  video.muted = true; video.setAttribute('playsinline', ''); video.srcObject = flux;
  try { await video.play(); } catch (e) {}
  let actif = true;
  const arreter = () => { if (!actif) return; actif = false; flux.getTracks().forEach(t => t.stop()); video.srcObject = null; };
  (async () => {
    while (actif) {
      if (video.readyState >= 2) { try { const r = await detecteur.detect(video); for (const c of r) if (actif && surTexte(c.rawValue)) { arreter(); return; } } catch (e) {} }
      await pause(180);
    }
  })();
  return arreter;
}

const MESSAGES_SYNC = {
  'hors-https':"La synchronisation fonctionne depuis l'appli installée (son adresse commence par https), pas depuis l'ancien fichier ouvert sur l'appareil.",
  'non-pris-en-charge':'Ce navigateur ne permet pas la synchronisation. Utilise Chrome, Edge ou Firefox à jour.',
